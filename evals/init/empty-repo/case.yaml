schema_version: "1.1"
name: init-empty-repo
description: init on an empty repo starts the stack interview and proposes no commands
runs: 1
tags: [init, shell]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Write, Edit]
  prompt: /devflow:init
graders:
  - name: no-commands
    type: regex
    pattern: 'npm run build|go build|dotnet build|cargo build|pnpm run'
    match: not_contains
  - name: starts-stack-interview
    type: llm
    criteria: |
      PASS if the final message starts a stack interview by asking the user what they want to
      build, and proposes no build, lint or test commands.
      FAIL if it proposes commands, or does not ask what the user wants to build.
