schema_version: "1.1"
name: init-go
description: init on a Go repo proposes the go commands and runs no stack interview
runs: 1
tags: [init, shell]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Write, Edit]
  prompt: /devflow:init
graders:
  - name: build-command
    type: regex
    pattern: 'go build \./\.\.\.'
  - name: lint-command
    type: regex
    pattern: 'go vet \./\.\.\.'
  - name: test-command
    type: regex
    pattern: 'go test \./\.\.\.'
  - name: proposes-commands-no-interview
    type: llm
    criteria: |
      PASS if the final message proposes the build, lint and test commands detected for the repo
      and does not run a stack interview: no questions about what to build, who the users are or
      where to host it, and no recommendation of a technology stack.
      FAIL if it asks what the user wants to build, asks about users or hosting, recommends a
      stack, or proposes no commands.
